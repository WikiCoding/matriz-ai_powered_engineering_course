openapi: 3.1.0
info:
  title: Matriz API
  version: 0.1.0
  description: |
    Proposed MVP contract for project task management; not approved for implementation.
    Approval and unresolved rules are tracked in docs/constraints.md (D-01 to D-10).
    No DELETE operations are exposed. The proposed authentication design delegates
    to Keycloak through the `matriz` realm and `matriz-client` OIDC client (D-02).
servers:
  - url: https://api.matriz.example.com/v1
    description: Placeholder API base URL; the AWS hostname is pending.
tags:
  - name: Users
  - name: Teams
  - name: Projects
  - name: Tasks
paths:
  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201': { $ref: '#/components/responses/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{userId}:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      tags: [Users]
      summary: Get a user
      operationId: getUser
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update a user's role
      description: Team membership is managed through the membership endpoint.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/team-memberships:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      tags: [Users]
      summary: List a user's team memberships
      operationId: listUserTeamMemberships
      responses:
        '200': { $ref: '#/components/responses/TeamList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Users]
      summary: Replace a user's team memberships
      description: Administrator-only. The permitted number of memberships is pending.
      operationId: replaceUserTeamMemberships
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamIds]
              properties:
                teamIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/TeamList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teams:
    get:
      tags: [Teams]
      summary: List teams
      operationId: listTeams
      responses:
        '200': { $ref: '#/components/responses/TeamList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /teams/{teamId}:
    parameters: [ { $ref: '#/components/parameters/TeamId' } ]
    get:
      tags: [Teams]
      summary: Get a team
      operationId: getTeam
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - name: archived
          in: query
          schema: { type: boolean }
          description: Archive-list behavior is pending.
      responses:
        '200': { $ref: '#/components/responses/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201': { $ref: '#/components/responses/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      responses:
        '200': { $ref: '#/components/responses/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Update a project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200': { $ref: '#/components/responses/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/archive:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    post:
      tags: [Projects]
      summary: Archive a project
      operationId: archiveProject
      responses:
        '200': { $ref: '#/components/responses/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/tasks:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [Tasks]
      summary: List tasks in a project
      operationId: listProjectTasks
      responses:
        '200': { $ref: '#/components/responses/TaskList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tasks]
      summary: Create a task in a project
      operationId: createProjectTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateInput' }
      responses:
        '201': { $ref: '#/components/responses/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{taskId}:
    parameters: [ { $ref: '#/components/parameters/TaskId' } ]
    get:
      tags: [Tasks]
      summary: Get a task
      operationId: getTask
      responses:
        '200': { $ref: '#/components/responses/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      summary: Update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    keycloakOAuth:
      type: oauth2
      description: Keycloak OIDC authorization-code flow for client `matriz-client` in realm `matriz`.
      flows:
        authorizationCode:
          authorizationUrl: https://{keycloak-host}/realms/matriz/protocol/openid-connect/auth
          tokenUrl: https://{keycloak-host}/realms/matriz/protocol/openid-connect/token
          refreshUrl: https://{keycloak-host}/realms/matriz/protocol/openid-connect/token
          scopes: { openid: OpenID Connect identity scope, profile: User profile, email: User email }
  parameters:
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    TeamId: { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Role: { type: string, enum: [ADMINISTRATOR, PROJECT_MANAGER, SOFTWARE_ENGINEER] }
    Status: { type: string, enum: [NOT_STARTED, ON_GOING, QA, DONE] }
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
    UserCreate:
      type: object
      required: [email, role]
      properties: { email: { type: string, format: email }, role: { $ref: '#/components/schemas/Role' } }
    UserUpdate:
      type: object
      properties: { role: { $ref: '#/components/schemas/Role' } }
    User:
      allOf:
        - $ref: '#/components/schemas/UserCreate'
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
    Team:
      type: object
      required: [id, name]
      properties: { id: { type: string, format: uuid }, name: { type: string } }
    ProjectInput:
      type: object
      required: [identifier, name, description, teamId]
      properties:
        identifier: { type: string }
        name: { type: string }
        description: { type: string }
        teamId: { type: string, format: uuid }
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectInput'
        - type: object
          required: [id, archived]
          properties: { id: { type: string, format: uuid }, archived: { type: boolean } }
    TaskCreateInput:
      type: object
      required: [identifier, title, description, effort, status, assigneeId]
      properties:
        identifier: { type: string }
        title: { type: string }
        description: { type: string }
        effort: { type: integer, enum: [1, 2, 3, 5, 8, 13] }
        status: { $ref: '#/components/schemas/Status' }
        assigneeId: { type: string, format: uuid }
    TaskUpdateInput:
      type: object
      description: All user-managed task fields are editable; timestamps and team are system-managed.
      properties:
        identifier: { type: string }
        title: { type: string }
        description: { type: string }
        effort: { type: integer, enum: [1, 2, 3, 5, 8, 13] }
        status: { $ref: '#/components/schemas/Status' }
        assigneeId: { type: string, format: uuid }
        projectId: { type: string, format: uuid, description: Moving the task derives a new team from the selected project. }
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskCreateInput'
        - type: object
          required: [id, projectId, teamId, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            teamId: { type: string, format: uuid, description: Derived from project }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
  responses:
    User: { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    UserList: { description: User list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
    Team: { description: Team, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
    TeamList: { description: Team list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Team' } } } } }
    Project: { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
    ProjectList: { description: Project list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } } }
    Task: { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    TaskList: { description: Task list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Task' } } } } }
    ValidationError: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing or invalid access token }
    Forbidden: { description: Authenticated user lacks permission }
    NotFound: { description: Resource not found }
security: [ { keycloakOAuth: [openid, profile, email] } ]
x-keycloak:
  realm: matriz
  clientId: matriz-client
  issuer: https://{keycloak-host}/realms/matriz
  logoutUrl: https://{keycloak-host}/realms/matriz/protocol/openid-connect/logout
  endSessionNote: POST logout with refresh_token and client_id; exact client authentication is deployment-specific.
