AWSTemplateFormatVersion: '2010-09-09'
Description: Matriz Ubuntu 26.04 LTS x86 host with Git, Docker, Compose and Node.js.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to create matriz-sg.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the selected VPC, with an internet gateway route.
  RootVolumeSize:
    Type: Number
    Default: 8
    MinValue: 8
    Description: Root EBS volume size in GiB; must be at least the AMI snapshot size.

Resources:
  MatrizSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: matriz-sg
      GroupDescription: Public access to the Matriz host and application services.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: SSH from IPv4
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - Description: SSH from IPv6
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: ::/0
        - Description: HTTP from IPv4
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTP from IPv6
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::/0
        - Description: HTTPS from IPv4
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTPS from IPv6
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
        - Description: PostgreSQL from IPv4
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
        - Description: PostgreSQL from IPv6
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIpv6: ::/0
        - Description: Keycloak admin from IPv4
          IpProtocol: tcp
          FromPort: 8180
          ToPort: 8180
          CidrIp: 0.0.0.0/0
        - Description: Keycloak admin from IPv6
          IpProtocol: tcp
          FromPort: 8180
          ToPort: 8180
          CidrIpv6: ::/0
        - Description: Backend from IPv4
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - Description: Backend from IPv6
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIpv6: ::/0
        - Description: Frontend from IPv4
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - Description: Frontend from IPv6
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIpv6: ::/0
        - Description: Grafana from IPv4
          IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          CidrIp: 0.0.0.0/0
        - Description: Grafana from IPv6
          IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          CidrIpv6: ::/0
      Tags:
        - Key: Name
          Value: matriz-sg

  MatrizInstance:
    Type: AWS::EC2::Instance
    Properties:
      # AMI IDs, key pairs and security groups are regional. Use eu-west-1.
      ImageId: ami-0fc7005aa213e82fa
      InstanceType: t3.xlarge
      KeyName: Matriz_KP
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref SubnetId
          GroupSet:
            - !GetAtt MatrizSecurityGroup.GroupId
      BlockDeviceMappings:
        # Ubuntu EC2 root mapping; Nitro exposes the device as NVMe inside Linux.
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: matriz
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/matriz-provisioning.log) 2>&1
          export DEBIAN_FRONTEND=noninteractive
          
          # Cloud-init runs as root; /root is the sudo -i login home.
          install -d -m 0755 \
            /root/config/loki \
            /root/config/grafana/provisioning/datasources \
            /root/config/prometheus

          cat > /root/config/loki/config.yaml <<'MATRIZ_LOKI_CONFIG'
          auth_enabled: false

          limits_config:
            allow_structured_metadata: true

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules

          schema_config:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          ruler:
            alertmanager_url: http://localhost:9093
          MATRIZ_LOKI_CONFIG

          cat > /root/config/grafana/provisioning/datasources/datasources.yaml <<'MATRIZ_GRAFANA_DATASOURCES'
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: false

            - name: Loki
              type: loki
              access: proxy
              url: http://loki:3100
              editable: false
          MATRIZ_GRAFANA_DATASOURCES

          cat > /root/config/prometheus/prometheus.yml <<'MATRIZ_PROMETHEUS_CONFIG'
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: [prometheus:9090]

            - job_name: matriz-backend
              metrics_path: /actuator/prometheus
              static_configs:
                - targets: [backend:8080]
          MATRIZ_PROMETHEUS_CONFIG

          cat > /root/deploy_ec2.sh <<'MATRIZ_DEPLOY_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          repository=${1:?Missing owner/repository}
          backend_release=${2:?Missing backend commit SHA}
          frontend_release=${3:?Missing frontend commit SHA}
          [[ "$repository" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || exit 2
          [[ "$backend_release" =~ ^[0-9a-f]{40}$ && "$frontend_release" =~ ^[0-9a-f]{40}$ ]] || exit 2

          # Installed beside docker-compose.yml in the root login home directory.
          cd -- "$(dirname -- "${BASH_SOURCE[0]}")"
          [[ -f docker-compose.yml ]] || { echo "Missing docker-compose.yml beside deployment script" >&2; exit 2; }
          command -v sed >/dev/null
          command -v grep >/dev/null
          docker compose version >/dev/null
          docker compose -f docker-compose.yml config --quiet

          # Match only the two tagged GHCR images, preserving quotes and other settings.
          image_pattern=$(printf '%s' "ghcr.io/${repository,,}" | sed 's/[.]/\\./g')
          backend_pattern="(^[[:space:]]*image:[[:space:]]*[\"']?${image_pattern}-backend:)[^\"'[:space:]]+"
          frontend_pattern="(^[[:space:]]*image:[[:space:]]*[\"']?${image_pattern}-frontend:)[^\"'[:space:]]+"
          [[ $(grep -Ec "$backend_pattern" docker-compose.yml) == 1 ]] || { echo "Expected one tagged backend image" >&2; exit 2; }
          [[ $(grep -Ec "$frontend_pattern" docker-compose.yml) == 1 ]] || { echo "Expected one tagged frontend image" >&2; exit 2; }

          docker compose -f docker-compose.yml down
          sed -E -i \
            -e "s|${backend_pattern}|\1${backend_release}|" \
            -e "s|${frontend_pattern}|\1${frontend_release}|" \
            docker-compose.yml
          docker compose -f docker-compose.yml up -d
          MATRIZ_DEPLOY_SCRIPT
          chmod 0700 /root/deploy_ec2.sh

          # Use Ubuntu's signed repositories and native x86 packages.
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y software-properties-common
          add-apt-repository -y universe
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y \
            docker.io docker-compose-v2

          systemctl enable --now docker
          docker --version
          docker compose version
          docker info
          touch /var/lib/cloud/instance/matriz-provisioning-complete

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref MatrizInstance
  PublicIp:
    Description: Public IPv4 address; may change after stop/start or replacement.
    Value: !GetAtt MatrizInstance.PublicIp
  SecurityGroupId:
    Description: ID of the created matriz-sg security group.
    Value: !GetAtt MatrizSecurityGroup.GroupId
  SshCommand:
    Description: Run with your private key file and SSH permitted by matriz-sg.
    Value: !Sub 'ssh -i "Matriz_KP.pem" ubuntu@${MatrizInstance.PublicIp}'
