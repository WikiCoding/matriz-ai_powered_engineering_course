spring.application.name=matriz-backend

server.port=${SERVER_PORT:8080}

# Local PostgreSQL defaults match the Compose app-db service.
# Supply APP_DB_PASSWORD or SPRING_DATASOURCE_PASSWORD in the environment.
# Inside Compose, override SPRING_DATASOURCE_URL to use the app-db hostname.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matriz}
spring.datasource.username=${APP_DB_USER:matriz}
spring.datasource.password=${APP_DB_PASSWORD:matriz}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway will own schema changes; do not run schema.sql/data.sql initialization.
spring.sql.init.mode=never

# Flyway is the sole application schema initializer.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true


# OAuth2 Resource Server JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/matriz}

# Keycloak password-grant login
keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:matriz}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:matriz-client}
keycloak.provisioning-client-id=${KEYCLOAK_PROVISIONING_CLIENT_ID:matriz-provisioning}
keycloak.provisioning-client-secret=${KEYCLOAK_PROVISIONING_CLIENT_SECRET:}

# CORS Configuration
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
cors.allowed-methods=${CORS_ALLOWED_METHODS:*}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}

# Management & Actuator Endpoints
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:9090/api/v1/otlp/v1/metrics}

# Server Configuration
server.forward-headers-strategy=none

# Validate external issuer while fetching signing keys over the internal identity network.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/matriz/protocol/openid-connect/certs}
