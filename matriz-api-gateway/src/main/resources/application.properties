# Spring Application
spring.application.name=matriz-api-gateway
server.port=${SERVER_PORT:8080}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# OAuth2 Resource Server JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/matriz}

# Keycloak password-grant login
keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:matriz}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:matriz-client}
keycloak.provisioning-client-id=${KEYCLOAK_PROVISIONING_CLIENT_ID:matriz-provisioning}
keycloak.provisioning-client-secret=${KEYCLOAK_PROVISIONING_CLIENT_SECRET:}

# Application profile provisioning (the backend owns profiles and team membership)
backend.base-url=${BACKEND_BASE_URL:http://localhost:8081}

# Spring Cloud Gateway Routes
spring.cloud.gateway.server.webflux.routes[0].id=matriz-backend
spring.cloud.gateway.server.webflux.routes[0].uri=${BACKEND_BASE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@clientIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=${RATE_LIMIT_REPLENISH_RATE:5}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=${RATE_LIMIT_BURST_CAPACITY:5}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.includeHeaders=true

# Management & Actuator Endpoints
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:9090/api/v1/otlp/v1/metrics}

# Server Configuration
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
