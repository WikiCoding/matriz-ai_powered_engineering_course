name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COMPOSE_FILE: docker-compose.yaml
  COMPOSE_PROFILES: prod

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build backend (unit tests)
        working-directory: matriz-backend
        run: ./mvnw verify

      - name: Start docker-compose services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c '
            while true; do
              if docker compose exec app-db pg_isready -U matriz matriz 2>/dev/null; then
                echo "PostgreSQL is ready"
                break
              fi
              echo "Waiting for PostgreSQL to become healthy..."
              sleep 5
            done
          '

      - name: Run full integration tests
        working-directory: matriz-backend
        run: ./mvnw verify

      - name: Stop docker-compose services
        if: always()
        run: docker compose down

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matriz-frontend/package-lock.json

      - name: Install dependencies
        working-directory: matriz-frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: matriz-frontend
        run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: matriz-frontend
        run: npm run build
