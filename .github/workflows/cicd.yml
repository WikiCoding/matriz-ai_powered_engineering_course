name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  revisions:
    name: Resolve component image revisions
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.revisions.outputs.backend }}
      frontend: ${{ steps.revisions.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve last commit affecting each image
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          for component in backend frontend; do
            revision=$(git log -1 --format=%H HEAD -- "matriz-$component/" .dockerignore .github/workflows/ci.yml)
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            echo "$component=$revision" >> "$GITHUB_OUTPUT"
          done

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make mvnw executable
        working-directory: matriz-backend
        run: chmod +x mvnw

      - name: Run backend unit, component and module tests
        working-directory: matriz-backend
        run: ./mvnw -B "-Dtest=!**/*IntegrationTest*,!MatrizBackendApplicationTests" test

      - name: Run backend integration tests and build
        working-directory: matriz-backend
        run: ./mvnw -B "-Dtest=**/*IntegrationTest*,MatrizBackendApplicationTests" verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matriz-frontend/package-lock.json

      - name: Install dependencies
        working-directory: matriz-frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: matriz-frontend
        run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: matriz-frontend
        run: npm run build

  publish:
    name: Publish ${{ matrix.component }} image
    needs: [backend, frontend, revisions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            revision: ${{ needs.revisions.outputs.backend }}
          - component: frontend
            revision: ${{ needs.revisions.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Check whether this component image already exists
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ matrix.revision }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$REVISION" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: matriz-${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ matrix.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to EC2
    needs: [publish, revisions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ec2
    concurrency:
      group: matriz-ec2-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH and deploy application images
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          EC2_PORT: ${{ vars.EC2_PORT || '22' }}
          DEPLOY_SCRIPT: ${{ vars.EC2_DEPLOY_SCRIPT || '/root/deploy-ec2.sh' }}
          BACKEND_REVISION: ${{ needs.revisions.outputs.backend }}
          FRONTEND_REVISION: ${{ needs.revisions.outputs.frontend }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" && -n "$EC2_HOST" ]] || { echo "Missing EC2 SSH configuration" >&2; exit 2; }
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$EC2_USER" =~ ^[a-zA-Z0-9_-]+$ && "$EC2_PORT" =~ ^[0-9]+$ ]] || exit 2
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$RELEASE" ]]; then
            echo "Skipping superseded commit $RELEASE"
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/matriz_key" "$HOME/.ssh/matriz_known_hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/matriz_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/matriz_known_hosts"
          printf -v remote_command 'sudo -n -i -- bash %q %q %q %q' "$DEPLOY_SCRIPT" "$REPOSITORY" "$BACKEND_REVISION" "$FRONTEND_REVISION"
          ssh -i "$HOME/.ssh/matriz_key" -p "$EC2_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/matriz_known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "$EC2_USER@$EC2_HOST" "$remote_command"
